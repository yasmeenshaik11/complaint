```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Login | Smart Public Complaint System</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <a class="brand" href="/">
      ⚖ Smart Public Complaint Prioritization
    </a>

    <h1>Citizen Login</h1>
    <p class="muted">Sign in to continue.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <div class="row-between">
        <label class="check">
          <input type="checkbox">
          Remember me
        </label>
        <span class="muted">Forgot password?</span>
      </div>

      <button class="btn btn-primary full" type="submit">
        Sign In
      </button>

      <p id="msg" class="message" role="status" aria-live="polite"></p>
    </form>

    <p>New citizen? <a href="/register">Create an account</a></p>

    <p>
      Official personnel?
      <a href="/authority/login">Official Login</a>
    </p>
  </main>

  <script src="/static/js/auth.js"></script>
</body>
</html>
```
