<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit Complaint</title><link rel="stylesheet" href="/static/css/style.css"></head><body><header class="app-header"><a class="brand" href="/citizen">⚖ Smart Public Complaint Prioritization</a><nav><a href="/citizen">Dashboard</a><a class="active" href="/citizen/submit">Submit Complaint</a><a href="/citizen/complaints">My Complaints</a><button class="link-btn" onclick="logout()">Logout</button></nav></header><main class="app-main narrow"><div class="page-head"><div><span class="eyebrow">NEW REQUEST</span><h1>Report a public issue</h1><p>Give enough detail for the AI and authority team to understand the problem.</p></div></div><form id="complaintForm" class="panel form-panel" enctype="multipart/form-data"><h2>1. Complaint Description</h2><label>Describe the problem in detail<textarea id="description" name="description" maxlength="2000" placeholder="Describe what happened, where it happened, and how serious the issue is..." required></textarea><small><span id="count">0</span>/2000 characters</small></label><h2>2. Complaint Image</h2><label class="dropzone">📷 <strong>Choose an image</strong><span>JPG, JPEG, PNG or WEBP • max 5 MB</span><input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="preview"></div><h2>3. Location</h2><div class="location-grid"><div><label>Address<input name="address" id="address" placeholder="Street / locality"></label><label>Area<input name="area" placeholder="Area"></label><label>City<input name="city" placeholder="City"></label><label>Landmark<input name="landmark" placeholder="Nearby landmark"></label></div><div class="location-box"><button type="button" class="btn btn-secondary" id="locate">📍 Use My Current Location</button><p id="coords" class="muted">No coordinates selected.</p><input type="hidden" name="latitude" id="latitude"><input type="hidden" name="longitude" id="longitude"></div></div><div class="form-actions"><button id="submitBtn" class="btn btn-primary" type="submit">Submit Complaint</button></div><div id="msg" class="message"></div></form></main><script src="/static/js/app.js"></script><script>requireAuth('CITIZEN'); initSubmit();</script></body></html>
