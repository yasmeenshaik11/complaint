<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaints</title><link rel="stylesheet" href="/static/css/style.css"></head><body><header class="app-header"><a class="brand" href="/authority">🏛 Civic Operations Console</a><nav><a href="/authority">Dashboard</a><a class="active" href="/authority/complaints">Complaints</a><a href="/authority/analytics">Analytics</a><button class="link-btn" onclick="logout()">Logout</button></nav></header><main class="app-main"><div class="page-head"><div><span class="eyebrow">COMPLAINT MANAGEMENT</span><h1>All complaints</h1></div></div><section class="panel"><div class="filters"><input id="search" placeholder="Search ID, description, location, category"><select id="priority"><option value="">All priorities</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select><select id="category"><option value="">All categories</option><option>Pothole/Road Damage</option><option>Garbage/Waste</option><option>Water Leakage</option><option>Broken Streetlight</option><option>Drainage/Sewage</option><option>Other</option></select><select id="status"><option value="">All statuses</option><option>PENDING</option><option>ASSIGNED</option><option>IN PROGRESS</option><option>RESOLVED</option><option>REJECTED</option></select><select id="sort"><option value="priority">Highest priority</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="lowest">Lowest priority</option></select></div><div id="table" class="table-wrap"></div></section></main><script src="/static/js/app.js"></script><script>requireAuth('AUTHORITY'); initAuthorityComplaints();</script></body></html>
