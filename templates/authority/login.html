<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authority Login</title><link rel="stylesheet" href="/static/css/style.css"></head><body class="auth-page"><div class="auth-card"><a class="brand" href="/">🏛 Civic Operations Console</a><h1>Authority sign in</h1><p class="muted">Authorized personnel only.</p><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn btn-primary full" type="submit">Sign In</button><p id="msg" class="message"></p></form><p><a href="/login">Citizen login</a></p></div><script src="/static/js/auth.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();const b=Object.fromEntries(new FormData(this));const m=document.getElementById('msg');m.textContent='Signing in...';const x=await post('/api/login',b);if(x.success){if(!['AUTHORITY','ADMIN'].includes(x.data.user.role)){m.textContent='This account is not an authority account.';return}localStorage.setItem('token',x.data.access_token);localStorage.setItem('user',JSON.stringify(x.data.user));location.href='/authority'}else m.textContent=x.message})</script></body></html>
