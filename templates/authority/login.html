<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Login | Smart Public Complaint System</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <a class="brand" href="/">
      🏛 Civic Operations Console
    </a>

    <h1>Official Login</h1>
    <p class="muted">Authorized personnel only.</p>

    <form id="loginForm">
      <label for="email">Official Email</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Enter your official email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" class="btn btn-primary full" type="submit">
        Sign In
      </button>

      <p id="msg" class="message" role="status" aria-live="polite"></p>
    </form>

    <p class="demo">
      <strong>Demo Official Account</strong><br>
      Email: authority.demo@example.com<br>
      Password: Authority@123
    </p>

    <p><a href="/login">Citizen Login</a></p>
    <p><a href="/">Back to Home</a></p>
  </main>

  <script src="/static/js/auth.js"></script>
</body>
</html>
